<title>jbCode</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #18181a;
    color: #f5f5f5;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }
  #matrix {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
  }
  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 48px;
    align-items: center;
  }
  .badge {
    font-family: 'Cascadia Code', Consolas, 'Courier New', monospace;
    font-size: clamp(1.6rem, 3.2vw, 2.2rem);
    font-weight: 700;
    margin-bottom: 20px;
  }
  .badge .bracket { color: #808080; }
  .badge .name { color: #4ec9b0; }
  h1 {
    font-size: clamp(2.2rem, 5.5vw, 3.4rem);
    line-height: 1.1;
    font-weight: 800;
    margin: 0 0 20px;
  }
  h1 .accent { color: #f97316; }
  .lead {
    color: #a1a1aa;
    font-size: clamp(1rem, 1.6vw, 1.15rem);
    line-height: 1.6;
    max-width: 480px;
    margin: 0 0 32px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #f97316;
    color: #ffffff;
    font-weight: 700;
    font-size: 1rem;
    text-decoration: none;
    padding: 14px 26px;
    border-radius: 999px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .cta:hover {
    background: #ea6a0d;
    transform: translateY(-1px);
  }
  .code-card {
    background: #1e1e1e;
    border: 1px solid #333336;
    border-radius: 14px;
    padding: 20px 24px 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    overflow-x: auto;
  }
  .dots {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .dots span {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }
  .dots .red { background: #ff5f56; }
  .dots .yellow { background: #ffbd2e; }
  .dots .green { background: #27c93f; }
  pre {
    margin: 0;
    font-family: 'Cascadia Code', Consolas, 'Courier New', monospace;
    font-size: clamp(0.75rem, 1.6vw, 0.9rem);
    line-height: 1.6;
    white-space: pre;
    color: #d4d4d4;
  }
  #typedCode {
    min-height: 20.8em;
  }
  .kw { color: #569cd6; }
  .key { color: #9cdcfe; }
  .str { color: #ce9178; }
  .cursor {
    color: #f97316;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width: 860px) {
    .wrap {
      grid-template-columns: 1fr;
      gap: 32px;
      padding: 64px 20px;
    }
    .lead { max-width: 100%; }
  }
</style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <div class="wrap">
    <div>
      <div class="badge"><span class="bracket">&lt;</span><span class="name">jbCode</span><span class="bracket">/&gt;</span></div>
      <h1>Transformamos<br><span class="accent">ideias em código</span></h1>
      <p class="lead">Desenvolvimento web completo, automação inteligente com n8n e soluções digitais sob medida para o seu negócio.</p>
      <a class="cta" href="https://wa.me/5545999810421" target="_blank" rel="noopener">Fale conosco no WhatsApp &rarr;</a>
    </div>

    <div class="code-card">
      <div class="dots">
        <span class="red"></span><span class="yellow"></span><span class="green"></span>
      </div>
      <pre id="typedCode"></pre>
    </div>
  </div>

  <script>
  (function () {
    var canvas = document.getElementById('matrix');
    var ctx = canvas.getContext('2d');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    var chars = '01{}[]()<>/\\;:=+-_$#@01'.split('');
    var word = 'jbCode';
    var fontSize = 16;
    var columns, drops, wordProgress;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.floor(canvas.width / fontSize);
      drops = new Array(columns).fill(1);
      wordProgress = new Array(columns).fill(-1);
    }
    resize();
    window.addEventListener('resize', resize);

    function draw() {
      ctx.fillStyle = 'rgba(24, 24, 26, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = fontSize + 'px "Cascadia Code", Consolas, monospace';

      for (var i = 0; i < drops.length; i++) {
        var text;
        if (wordProgress[i] >= 0) {
          text = word[wordProgress[i]];
          ctx.fillStyle = '#ffe8d1';
          wordProgress[i]++;
          if (wordProgress[i] >= word.length) wordProgress[i] = -1;
        } else {
          text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillStyle = '#f97316';
          if (Math.random() < 0.00015) wordProgress[i] = 0;
        }
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(draw, 50);
  })();
  </script>

  <script>
  (function () {
    var el = document.getElementById('typedCode');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var runs = [
      { cls: 'kw', text: 'const ' },
      { cls: null, text: 'jbCode = {\n  ' },
      { cls: 'key', text: 'nome' },
      { cls: null, text: ': ' },
      { cls: 'str', text: '"jbCode"' },
      { cls: null, text: ',\n  ' },
      { cls: 'key', text: 'responsavel' },
      { cls: null, text: ': ' },
      { cls: 'str', text: '"JB Candeloro"' },
      { cls: null, text: ',\n  ' },
      { cls: 'key', text: 'servicos' },
      { cls: null, text: ': [\n    ' },
      { cls: 'str', text: '"Front-end Development"' },
      { cls: null, text: ',\n    ' },
      { cls: 'str', text: '"Back-end Development"' },
      { cls: null, text: ',\n    ' },
      { cls: 'str', text: '"Automação com n8n"' },
      { cls: null, text: ',\n    ' },
      { cls: 'str', text: '"Criação de Sites"' },
      { cls: null, text: ',\n  ],\n  ' },
      { cls: 'key', text: 'missao' },
      { cls: null, text: ': ' },
      { cls: 'str', text: '"Transformar ideias em realidade digital"' },
      { cls: null, text: ',\n};\n\n' },
      { cls: 'kw', text: 'export default' },
      { cls: null, text: ' jbCode;' }
    ];

    if (reduceMotion) {
      runs.forEach(function (run) {
        var span = document.createElement('span');
        if (run.cls) span.className = run.cls;
        span.textContent = run.text;
        el.appendChild(span);
      });
      return;
    }

    var flat = [];
    runs.forEach(function (run) {
      for (var i = 0; i < run.text.length; i++) {
        flat.push({ ch: run.text[i], cls: run.cls });
      }
    });

    var cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.textContent = '▌';
    el.appendChild(cursor);

    var idx = 0;
    var currentSpan = null;
    var currentCls;
    var started = false;

    function step() {
      if (idx >= flat.length) return;
      var item = flat[idx];
      if (item.cls !== currentCls || !currentSpan) {
        currentCls = item.cls;
        currentSpan = document.createElement('span');
        if (currentCls) currentSpan.className = currentCls;
        el.insertBefore(currentSpan, cursor);
      }
      currentSpan.appendChild(document.createTextNode(item.ch));
      idx++;
      setTimeout(step, 24 + Math.random() * 32);
    }

    function start() {
      if (started) return;
      started = true;
      step();
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) start();
      });
    }, { threshold: 0.2 });
    observer.observe(el);
  })();
  </script>
</body>
</html>
