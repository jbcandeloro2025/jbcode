<title>JB Code</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6f5;
    --card: #ffffff;
    --text: #1c2321;
    --muted: #6b7570;
    --primary: #2f7a4d;
    --primary-dark: #235c3a;
    --border: #dfe5e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141816;
      --card: #1e2422;
      --text: #eef1ef;
      --muted: #9aa5a0;
      --primary: #4caf7d;
      --primary-dark: #3c8f65;
      --border: #2c3532;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    text-align: center;
  }
  .logo {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    display: block;
    border-radius: 14px;
  }
  h1 {
    font-size: 1.7rem;
    margin: 0 0 8px;
  }
  p.subtitle {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: left;
  }
  .links a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    font-weight: 600;
    font-size: 0.95rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .links a:hover {
    border-color: var(--primary);
    background: var(--bg);
  }
  .links a .desc {
    display: block;
    font-weight: 400;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 2px;
  }
  .links a .arrow {
    color: var(--primary);
    font-weight: 700;
    flex-shrink: 0;
  }
  .footer {
    margin-top: 32px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
